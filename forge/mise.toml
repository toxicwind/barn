# forge (barn) build tasks — mbx-cache / nativelink enabled.
# `mise run forge-build` bundles src/cli.ts -> bin/forge.ts; mbx-cache restores
# it from the remote task cache at 127.0.0.1:25148 when sources are unchanged.
#
# CACHE GOTCHA (estate doctrine): a task is only storable if it declares BOTH
# sources AND explicit outputs. `bin/forge.ts` is a committed bundle — its own
# content is the output glob, and editing the config/package/source invalidates
# the cache.

[task_config.cache]
enabled = true

[tasks.forge-build]
description = "Bundle the forge CLI src -> bin/forge.ts (mbx-cache remote:25148)"
sources = [
  "src/**/*.ts",
  "package.json",
  "bun.lock",
]
outputs = ["bin/forge.ts"]
run = """
set -eo pipefail
bun build src/cli.ts --outfile bin/forge.ts --target=bun --format=esm
sed -i '1s|^|#!/usr/bin/env bun\\n|' bin/forge.ts
chmod +x bin/forge.ts
"""

[tasks.forge-install]
description = "Install forge on PATH by symlinking the bundled entry (barn home)"
run = "scripts/install-forge.sh && touch .install-complete"
sources = ["bin/forge.ts", "scripts/install-forge.sh"]
outputs = [".install-complete"]

[tasks.forge-doctor]
description = "Run forge doctor (self-health of every leg)"
run = "bun bin/forge.ts doctor"