[daemons.kennel]
# KENNEL = the agentMonitor — the agent's OWN desktop (Xvnc :99, the PLACE).
# Modular family: kennel (this — walls) · waterbowl (browser) · flap (VNC door).
# 2026-11-04: VncAuth dropped — bound to -localhost only, the password gate
# added nothing and blocked noVNC (browser can't pass -passwd). noVNC + the
# clip-mirror bridge are the keeper surfaces now.
run = "exec Xvnc :99 -geometry 1440x2560 -depth 24 -rfbport 5900 -localhost -SecurityTypes None"
auto = ["start"]
retry = true
ready_cmd = "ss -tln | grep -q 127.0.0.1:5900"
port = 5900
boot_start = true
dir = "."
mise = true

[daemons.bed]
# BED = the kennel's WM (openbox+tint2 on :99) — where the dog rests.
run = "export DISPLAY=:99 LD_LIBRARY_PATH=/home/toxic/.browserless/kennel/openbox-build/lib; (tint2 </dev/null >/tmp/tint2.log 2>&1 &) ; exec /home/toxic/.browserless/kennel/openbox-build/bin/openbox >> /home/toxic/.browserless/kennel/agent-wm.log 2>&1"
auto = ["start"]
retry = true
ready_cmd = "DISPLAY=:99 xprop -root _NET_SUPPORTING_WM_CHECK 2>/dev/null | grep -q ."
port = 0
boot_start = true
dir = "."
mise = true

[daemons.clip-mirror]
# CLIP-MIRROR = host→keeper clipboard bridge (2026-11-03). TigerVNC vncviewer
# under XWayland never sees wl-native clipboard ownership changes, so
# ClientCutText never fired and paste into the keeper was empty. This polls
# the wl clipboard and pushes changes into Xvnc :99 CLIPBOARD directly.
