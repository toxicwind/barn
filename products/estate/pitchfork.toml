auto = []

# retain-slot fix 2026-10-24: give retain a reserved floor so the Hindsight
# worker can drain its 885-item claimable backlog. Hindsight's default reserves
# 2 slots for consolidation with no retain floor, so with max_slots=2 retain
# gets 0 shared slots and never claims. Now max=4, retain floor=2, consolidation
# floor=1, leaving 1 shared slot.
[daemons.hindsight.env]
HINDSIGHT_API_LLM_PROVIDER = "openai"
HINDSIGHT_API_LLM_MODEL = "glm-5.3-flash"
HINDSIGHT_API_LLM_BASE_URL = "http://127.0.0.1:25193/v1"
HINDSIGHT_API_WORKER_MAX_SLOTS = "4"
HINDSIGHT_API_WORKER_RETAIN_RESERVED_SLOTS = "2"
HINDSIGHT_API_WORKER_CONSOLIDATION_RESERVED_SLOTS = "1"

