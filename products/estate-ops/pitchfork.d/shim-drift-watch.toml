# ranch/ops — project-owned daemon manifest. Source of truth for 'shim-drift-watch'.
# Event-driven (inotify on the shim files); the sentinel runs only when a
# canonical sidechat-shim copy actually changes. No polling.

[daemons.shim-drift-watch]
run = "exec /usr/bin/bash /home/toxic/estate/ranch/ops/bin/shim-drift-watch.sh"
dir = "/home/toxic/estate/ranch/ops/bin"
mise = false
retry = true
boot_start = true
auto = ["start"]
