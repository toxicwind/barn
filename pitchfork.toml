# nativelink: barn product (REAPI executor). CAS/AC gRPC-backed by buildbuddy
# (:25218). frontend(scheduler/client) 25155, worker_api 25157 (ports SSOT).
# no `port` field (pre-check 0.0.0.0 conflicts); ready_http on worker_api.
[daemons.nativelink]
run = "exec /home/toxic/pens/ranch/forge/ops/nativelink/run.sh"
dir = "/home/toxic/pens/barn/products/nativelink"
