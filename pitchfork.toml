# No `port` field: pre-check binds 0.0.0.0 and false-conflicts with tailscaled SNI forwarder on :25127. ready_http only.

# blackbird: barn product (github code search). api :25112, mcp :25113 (thresher upstream), web :25114.
# Ports are passed as explicit env: no dependency on any ports.env path. ready_http only, no `port` field.
[daemons.blackbird-api]
run = "exec /home/toxic/.bun/bin/bun /home/toxic/pens/barn/products/blackbird/apps/api/src/server.ts"
dir = "/home/toxic/pens/barn/products/blackbird"
retry = true
mise = false
