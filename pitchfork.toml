# Restored 2026-11-09 from quarantine/mise-pitchfork/barn__pitchfork.toml (thresher only; additive).
[daemons.thresher]
run = "exec /home/toxic/pens/barn/products/thresher/bin/serve-guarded.sh"
retry = true
ready_http = "http://127.0.0.1:25127/health"
